{% extends "base.html" %}
{% block titulo %}Login - Gerador de Etiquetas{% endblock %}
{% block conteudo_publico %}
<div class="login-page">
    <div class="login-card shadow">
        <div class="text-center mb-4">
            <i class="bi bi-tags-fill login-icon"></i>
            <h3 class="mt-2 mb-0">Gerador de Etiquetas</h3>
            <p class="text-muted small">Acesse sua conta para continuar</p>
        </div>
        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="mb-3">
                <label class="form-label">E-mail</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" name="email" class="form-control" placeholder="seu@email.com"
                           value="{{ email or '' }}" required autofocus>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label">Senha</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" name="senha" class="form-control" placeholder="••••••••" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-box-arrow-in-right"></i> Entrar
            </button>
        </form>
        <div class="text-center mt-4 small text-muted">
            Usuário inicial: <strong>admin@admin.com</strong> / <strong>Admin@123</strong>
        </div>
    </div>
</div>
{% endblock %}
