{% extends "base.html" %}
{% block titulo %}Erro {{ codigo }}{% endblock %}
{% block conteudo %}
<div class="text-center py-5">
    <h1 class="display-3 text-danger">{{ codigo }}</h1>
    <p class="lead">{{ mensagem }}</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">
        <i class="bi bi-house"></i> Voltar ao Dashboard
    </a>
</div>
{% endblock %}
{% block conteudo_publico %}
<div class="container text-center py-5">
    <h1 class="display-3 text-danger">{{ codigo }}</h1>
    <p class="lead">{{ mensagem }}</p>
    <a href="{{ url_for('auth.login') }}" class="btn btn-primary">Ir para o login</a>
</div>
{% endblock %}
