{% extends "base.html" %}
{% block titulo %}Editar Modelo{% endblock %}
{% block conteudo %}
<h2 class="page-title"><i class="bi bi-layout-text-window"></i> Editar Modelo</h2>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Nome *</label>
                    <input type="text" name="nome" class="form-control" value="{{ modelo.nome }}" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Largura (mm) *</label>
                    <input type="number" step="0.1" name="largura" class="form-control" value="{{ modelo.largura }}" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Altura (mm) *</label>
                    <input type="number" step="0.1" name="altura" class="form-control" value="{{ modelo.altura }}" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Status</label>
                    <select name="status" class="form-select">
                        <option value="ativo" {% if modelo.status == 'ativo' %}selected{% endif %}>Ativo</option>
                        <option value="inativo" {% if modelo.status == 'inativo' %}selected{% endif %}>Inativo</option>
                    </select>
                </div>
                <div class="col-12">
                    <div class="alert alert-info small mb-0">
                        <i class="bi bi-info-circle"></i>
                        O tipo de layout (<strong>{{ modelo.tipo }}</strong>) é pré-configurado e não pode ser alterado nesta versão do sistema.
                    </div>
                </div>
            </div>

            <div class="mt-4 d-flex gap-2">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Salvar</button>
                <a href="{{ url_for('modelos.listar') }}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
